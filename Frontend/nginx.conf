server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Indispensable pour React Router : toute route inconnue de Nginx
    # (ex: /dossiers/abc/chat) doit quand même renvoyer index.html,
    # pour que React Router prenne le relais côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}